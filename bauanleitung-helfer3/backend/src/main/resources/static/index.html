<!DOCTYPE HTML>
<html>
<head>
    <title>Your first Spring application</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<p><a href="/hello">Greet the world!</a></p>

<form action="/hello" method="GET" id="nameForm">
    <div>
        <label for="nameField">How should the app call you?</label>
        <input name="myName" id="nameField">
        <button>Greet me!</button>
    </div>
</form>

<p>Test Material berechnen</p>

<form action="/calculate" method="GET" id="recipeName">
    <div>
        <label for="recipe">Welche Bauanleitung suchen Sie für die Berechnung?</label>
        <input name="queryRecipe" id="recipe">
        <button>Berechnen</button>
    </div>
</form>

<p>Test Bauanleitung Suchen</p>

<form action="/search" method="GET" id="searchRecipe">
    <div>
        <label for="search">Welche Bauanleitung suchen Sie?</label>
        <input name="searchRecipe" id="search">
        <button>Suchen</button>
    </div>
</form>
</body>
</html>
